<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#263e32">
  <meta name="apple-mobile-web-app-title" content="Family Wishes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/touch.png">
  <link rel="icon" href="./icons/touch.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Manna Family Wish List</title>
</head>
<body>
  <main id="welcome">
    <div class="parcel">
      <div class="ribbon" aria-hidden="true"></div>
      <div class="invite">
        <img src="./icons/touch.png" width="64" height="64" alt="">
        <h1>Manna Family<br>Wish List</h1>
        <p>A place for Christmas wishes and a few well-kept surprises.</p>
        <button id="login" class="primary" disabled>Continue with Google</button>
        <p id="auth-message" class="small" role="status">Checking sign-in…</p>
      </div>
    </div>
  </main>
  <main id="book" hidden>
    <header class="masthead">
      <span class="brand"><img src="./icons/touch.png" width="38" height="38" alt="">Manna Family Wish List</span>
      <div class="account"><span id="account-name"></span><button class="quiet" id="logout">Sign out</button></div>
    </header>
    <nav aria-label="Wish lists">
      <button id="my-tab" aria-current="page">My List</button>
      <button id="family-tab">Family Lists</button>
    </nav>
    <header class="list-heading">
      <h1 id="list-title">My List</h1>
      <label id="picker" hidden>Family member<select id="recipient"></select></label>
    </header>
    <section class="paper" aria-labelledby="list-title">
      <div class="toolbar">
        <p id="list-summary" class="count" aria-live="polite"></p>
        <button id="add" class="primary">+ Add a wish</button>
      </div>
      <div id="filters" hidden>
        <label>Show<select id="filter"><option value="all">All gifts</option><option value="available">Available only</option><option value="purchased">Purchased only</option></select></label>
        <label class="check"><input type="checkbox" id="sort" checked> Available first</label>
      </div>
      <p id="list-message" role="status"></p>
      <button id="retry" hidden>Try again</button>
      <div id="items"></div>
    </section>
  </main>
  <dialog id="editor" aria-labelledby="form-title">
    <form id="gift-form">
      <h2 id="form-title">Add a wish</h2>
      <label>Gift name<input name="name" required autofocus placeholder="What do you have in mind?"></label>
      <label>Product link <span>(optional)</span><input name="link" type="url" placeholder="https://" inputmode="url"></label>
      <label><strong id="notes-label">Your wishlist notes</strong><textarea name="notes" rows="3"></textarea></label>
      <p class="small" id="note-hint"></p>
      <p class="error" id="form-error" role="alert"></p>
      <div class="actions"><button type="button" id="cancel">Cancel</button><button id="save" class="primary">Save wish</button></div>
    </form>
  </dialog>
  <div id="toast" role="status"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
